# Free pilot services. Supply a dedicated managed PostgreSQL URL (for example Neon).
services:
  - type: web
    name: nutritrack-ghana-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: EVIDENCE_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: staging
      - key: CORS_ORIGINS
        sync: false
      - key: MAIN_ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
  - type: web
    name: nutritrack-ghana
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /index.html
        name: Cache-Control
        value: no-cache
