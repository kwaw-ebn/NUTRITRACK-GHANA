name: Validate NutriTrack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m alembic upgrade head && python -m app.seed && python -m alembic downgrade base
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./migration-check.db
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r backend/requirements.txt && python scripts/init_ui_test.py
      - run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/nutritrack-ui-api.log 2>&1 &
          cd ../frontend
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8001/health && break || sleep 1; done
          npm run test
        env:
          DATABASE_URL: sqlite:////tmp/nutritrack-ui-test.db
          SETUP_TOKEN: ui-test-onboarding-token-1234567890
          ENVIRONMENT: development
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutritrack
          POSTGRES_USER: nutritrack
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nutritrack" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m alembic upgrade head && python -m app.seed && python -m alembic downgrade base
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://nutritrack:ephemeral-ci-only@localhost:5432/nutritrack
